[project]
name = "quantmind"
version = "0.1.0"
description = "QuantMind - AI 驱动的国内多资产（期货/A股/港股/期权）量化投研框架"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "akshare>=1.13",
    "mootdx>=1.13",
    "yfinance>=0.2",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "streamlit>=1.36",
    "plotly>=5.22",
    "httpx>=0.27",
    "optuna>=3.6",
    "openai>=1.30",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = ["langchain>=0.2", "anthropic>=0.25"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["quantmind"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
quantmind = ["web/*.py", "ai/prompts/*"]
