[project]
name = "quantmind"
version = "0.1.0"
description = "QuantMind - AI 驱动的国内多资产（期货/A股/港股/期权）量化投研框架"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "akshare>=1.13",
    "yfinance>=0.2",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "streamlit>=1.36",
    "plotly>=5.22",
    "httpx>=0.27",
    "optuna>=3.6",
    "apscheduler>=3.10",
    "openai>=1.30",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "python-dotenv>=1.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    "tqsdk>=3.10",
    "efinance>=0.4",
]

[project.optional-dependencies]
# mootdx 依赖 httpx<0.26，与项目 httpx>=0.27 冲突；如需启用请先 `pip install "httpx<0.26"` 再装。
# 默认 A 股实时源走 MootdxAStockFeed 内置的 akshare 回退，无需 mootdx。
llm = ["langchain>=0.2", "anthropic>=0.25"]
realtime = ["mootdx>=0.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["quantmind"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
quantmind = ["web/*.py", "ai/prompts/*"]
